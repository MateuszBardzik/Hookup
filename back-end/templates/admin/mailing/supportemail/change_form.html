{% extends "admin/change_form.html" %}
{% comment %} Support email page: adds "send a test to me" and "send to all recipients" buttons (mailing/admin.py). {% endcomment %}
{% block submit_buttons_bottom %}
  {% if is_draft %}
    <div class="submit-row" style="gap:10px">
      <input type="submit" value="Save and send a test to me" name="_send_test">
      <input type="submit" class="default" name="_send_all"
             value="Save and send to all recipients{% if recipient_count %} ({{ recipient_count }}){% endif %}"
             onclick="return confirm('Send this email to all recipients now? This cannot be undone.');">
    </div>
  {% endif %}
  {{ block.super }}
{% endblock %}
