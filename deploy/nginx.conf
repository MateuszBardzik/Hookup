# nginx site for engivexlab (server-setup.sh replaces __DOMAIN__ and installs it to
# /etc/nginx/sites-available/engivexlab; certbot then adds the HTTPS part).
#   /             the React website (front-end/dist), every page falls back to index.html
#   /api/ /hookup/ Django (gunicorn; /hookup/ = admin pages)
#   /static/      admin CSS/JS (collectstatic)      /media/  uploaded files
server {
    listen 80;
    server_name __DOMAIN__ www.__DOMAIN__;

    root /srv/engivexlab/app/front-end/dist;
    index index.html;
    client_max_body_size 20m;   # resume / photo uploads

    location /api/ {
        proxy_pass http://unix:/run/engivexlab/gunicorn.sock;
        include proxy_params;
    }
    location /hookup/ {
        proxy_pass http://unix:/run/engivexlab/gunicorn.sock;
        include proxy_params;
    }
    location /static/ {
        alias /srv/engivexlab/app/back-end/staticfiles/;
        expires 7d;
    }
    location /media/ {
        alias /srv/engivexlab/app/back-end/media/;
    }
    # built JS/CSS have a hash in their name, so browsers may keep them for a year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location / {
        try_files $uri /index.html;
    }
}
