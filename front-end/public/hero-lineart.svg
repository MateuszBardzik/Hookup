<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" width="560" height="560" role="img" aria-label="Fine-line drawing: a circuit board, a wireframe 3D mesh and a rigged cartoon character" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    Hero illustration (fine-line style). Three layers from back to front:
    circuit board, wireframe 3D mesh, rigged cartoon character.
    Colours: line #1d4f94, dots #5aa2f0, fill #edf4fe (same as the hero panel).
  -->
  <defs>
    <style>
      .ln{fill:none;stroke:#1d4f94;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
      .thin{fill:none;stroke:#1d4f94;stroke-width:.9;stroke-linecap:round;opacity:.55}
      .guide{fill:none;stroke:#5aa2f0;stroke-width:1;stroke-dasharray:3 6;opacity:.8}
      .dot{fill:#5aa2f0}
      .pad{fill:#edf4fe;stroke:#1d4f94;stroke-width:1.2}
      .lbl{font:600 9.5px 'Work Sans',system-ui,sans-serif;letter-spacing:.12em;fill:#4b5d78}
    </style>
  </defs>

  <!-- construction circles -->
  <circle class="guide" cx="280" cy="280" r="250"/>
  <circle class="thin" cx="280" cy="280" r="196"/>

  <!-- 1. circuit board (back) -->
  <g transform="translate(92 118)">
    <rect class="ln" x="0" y="0" width="236" height="166" rx="12" style="fill:#edf4fe"/>
    <circle class="thin" cx="14" cy="14" r="4"/><circle class="thin" cx="222" cy="14" r="4"/>
    <circle class="thin" cx="14" cy="152" r="4"/><circle class="thin" cx="222" cy="152" r="4"/>
    <!-- chip -->
    <rect class="ln" x="84" y="52" width="58" height="58" rx="4"/>
    <circle class="thin" cx="94" cy="62" r="2.5"/>
    <path class="thin" d="M92 52v-8M104 52v-8M116 52v-8M128 52v-8M92 110v8M104 110v8M116 110v8M128 110v8M84 62h-8M84 74h-8M84 86h-8M84 98h-8M142 62h8M142 74h8M142 86h8M142 98h8"/>
    <!-- traces -->
    <path class="ln" d="M92 44V30l-14-14H30M104 44V24M116 44V34l12-12h58M76 74H48l-12 12v40M76 98H58l-14 14v24M150 62h26l14 14v36M150 86h18l12 12v34l-10 10H120M116 118v22l-8 8H70"/>
    <circle class="pad" cx="30" cy="16" r="4"/><circle class="pad" cx="104" cy="24" r="4"/>
    <circle class="pad" cx="186" cy="22" r="4"/><circle class="pad" cx="36" cy="126" r="4"/>
    <circle class="pad" cx="44" cy="136" r="4"/><circle class="pad" cx="190" cy="112" r="4"/>
    <circle class="pad" cx="120" cy="142" r="4"/><circle class="pad" cx="70" cy="148" r="4"/>
    <!-- connector -->
    <rect class="thin" x="176" y="128" width="40" height="18" rx="3"/>
    <path class="thin" d="M184 132v10M192 132v10M200 132v10M208 132v10"/>
  </g>

  <!-- 2. wireframe mesh (middle) -->
  <g transform="translate(372 262)">
    <circle cx="0" cy="0" r="104" fill="#edf4fe"/>
    <circle class="ln" cx="0" cy="0" r="104"/>
    <ellipse class="thin" rx="72" ry="104"/>
    <ellipse class="thin" rx="36" ry="104"/>
    <path class="thin" d="M0 -104V104"/>
    <ellipse class="thin" rx="104" ry="30"/>
    <ellipse class="thin" cy="-52" rx="90" ry="24"/>
    <ellipse class="thin" cy="52" rx="90" ry="24"/>
    <ellipse class="thin" cy="-86" rx="58" ry="14"/>
    <ellipse class="thin" cy="86" rx="58" ry="14"/>
    <circle class="dot" cx="0" cy="-104" r="3"/><circle class="dot" cx="-104" cy="0" r="3"/>
    <circle class="dot" cx="104" cy="0" r="3"/><circle class="dot" cx="0" cy="104" r="3"/>
    <circle class="dot" cx="-72" cy="-52" r="2.5"/><circle class="dot" cx="72" cy="52" r="2.5"/>
  </g>

  <!-- 3. cartoon character with rig (front) -->
  <g transform="translate(236 370)">
    <!-- sprout -->
    <path class="ln" d="M0 -78c0-12 2-20 6-28"/>
    <path class="ln" d="M6 -104c10-14 30-16 38-8c-8 12-26 16-38 8z" style="fill:#ffffff"/>
    <path class="ln" d="M4 -96c-10-10-26-8-32 0c8 8 22 8 32 0z" style="fill:#ffffff"/>
    <!-- body -->
    <path class="ln" style="fill:#ffffff" d="M0 -80c40 0 62 34 62 76c0 44-26 70-62 70s-62-26-62-70c0-42 22-76 62-76z"/>
    <!-- face -->
    <ellipse cx="-18" cy="-24" rx="7" ry="9" fill="#1d4f94"/>
    <ellipse cx="18" cy="-24" rx="7" ry="9" fill="#1d4f94"/>
    <circle cx="-16" cy="-27" r="2.2" style="fill:#ffffff"/><circle cx="20" cy="-27" r="2.2" style="fill:#ffffff"/>
    <path class="ln" d="M-14 -2c8 8 20 8 28 0"/>
    <!-- arms + legs -->
    <path class="ln" d="M-60 6c-16 4-26 -4-32 -18M60 6c16 2 24 -10 28 -26M-22 64v18M22 64v18"/>
    <path class="ln" d="M-30 82h16M14 82h16"/>
    <!-- rig: joints and bones -->
    <path class="guide" d="M0 -60V40M0 40l-22 42M0 40l22 42M0 0l-60 6-32-18M0 0l60 6 28-26"/>
    <circle class="dot" cx="0" cy="-60" r="3.5"/><circle class="dot" cx="0" cy="0" r="3.5"/>
    <circle class="dot" cx="0" cy="40" r="3.5"/><circle class="dot" cx="-60" cy="6" r="3"/>
    <circle class="dot" cx="60" cy="6" r="3"/><circle class="dot" cx="-92" cy="-12" r="3"/>
    <circle class="dot" cx="88" cy="-20" r="3"/><circle class="dot" cx="-22" cy="82" r="3"/>
    <circle class="dot" cx="22" cy="82" r="3"/>
  </g>

  <!-- labels with leader lines -->
  <path class="thin" d="M110 110l-18-22h-34"/>
  <text class="lbl" x="58" y="82">PCB · CAD</text>
  <path class="thin" d="M452 196l24-30h36"/>
  <text class="lbl" x="462" y="160">3D MESH</text>
  <path class="thin" d="M178 420l-40 46h-78"/>
  <text class="lbl" x="60" y="480">CHARACTER RIG</text>
</svg>
