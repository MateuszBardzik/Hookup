<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img" aria-label="A tablet showing a checklist and a found bug" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Fine-line illustration (same style as hero-lineart.svg). Colours: line #1d4f94, dots #5aa2f0, panel #edf4fe. -->
