    <style>.l{fill:none;stroke:#1d4f94;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.t{fill:none;stroke:#1d4f94;stroke-width:1;stroke-linecap:round;opacity:.5}.d{fill:#5aa2f0}.w{fill:#fff}.a{fill:none;stroke:#5aa2f0;stroke-width:1.6;stroke-dasharray:4 5}.lb{font:600 10px 'Work Sans',system-ui,sans-serif;letter-spacing:.1em;fill:#4b5d78}</style>
  </defs>
  <rect width="480" height="320" fill="#edf4fe"/><rect width="480" height="320" fill="url(#g)"/>

