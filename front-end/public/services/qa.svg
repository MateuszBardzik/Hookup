  <rect class="a" x="148" y="170" width="30" height="30" rx="4"/>
  <circle class="l" cx="360" cy="190" r="44" style="fill:#fff"/>
  <path class="l" d="M391 221l30 30"/>
  <ellipse class="l" cx="360" cy="192" rx="14" ry="18" style="fill:#dbe8fb"/><path class="l" d="M346 186h-10M346 198h-10M374 186h10M374 198h10M353 174l-5-6M367 174l5-6M360 176v34"/>
  <circle class="d" cx="120" cy="36" r="3.5"/><circle class="d" cx="310" cy="286" r="3.5"/>
